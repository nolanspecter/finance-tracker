<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal Finance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<nav class="nav">
  <div class="brand">💰 Personal Finance</div>
  <a href="{{ url_for('dashboard') }}">Dashboard</a>
  <a href="{{ url_for('transactions_list') }}">Transactions</a>
  <a href="{{ url_for('investments_view') }}">Investments</a>
  <a href="{{ url_for('categories_view') }}">Categories & Budgets</a>
  <form method="post" action="{{ url_for('set_currency') }}" class="currency-picker">
    <label for="currency-select">Currency</label>
    <select id="currency-select" name="currency" onchange="this.form.submit()">
      {% for code, sym in currencies.items() %}
        <option value="{{ code }}" {% if code == currency_code %}selected{% endif %}>{{ code }} ({{ sym }})</option>
      {% endfor %}
    </select>
  </form>
</nav>

<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
